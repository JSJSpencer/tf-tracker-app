  }

  .top-row { display: flex; align-items: center; justify-content: space-between; }

  .video-link { margin-top: 8px; display: inline-block; font-size: 12px; text-decoration: underline; }

  .modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

/* ---------------------------------------------------------------
   ICONS — tiny inline SVGs, no external icon library required
----------------------------------------------------------------*/
function icon(name, { size = 18, color = "currentColor", strokeWidth = 2 } = {}) {
  const a = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round"`;
  switch (name) {
    case "check": return `<svg ${a}><polyline points="20 6 9 17 4 12"/></svg>`;
    case "timer": return `<svg ${a}><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>`;
    case "play": return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
    case "pause": return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
    case "rotate-ccw": return `<svg ${a}><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`;
    case "chevron-left": return `<svg ${a}><polyline points="15 18 9 12 15 6"/></svg>`;
    case "chevron-right": return `<svg ${a}><polyline points="9 18 15 12 9 6"/></svg>`;
    case "zap": return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
    case "refresh-cw": return `<svg ${a}><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>`;
    case "mountain": return `<svg ${a}><path d="M3 20l7-11 4 6 3-4 4 9H3z"/></svg>`;
    case "move": return `<svg ${a}><path d="M4 12h16"/><path d="M4 12l4-4M4 12l4 4"/><path d="M20 12l-4-4M20 12l-4 4"/><path d="M12 4v16"/></svg>`;
    case "leaf": return `<svg ${a}><path d="M11 20A7 7 0 0 1 4 13c0-5 8-11 15-11 0 8-4 18-8 18z"/><path d="M4 13c4 0 8-2 11-9"/></svg>`;
    case "droplet": return `<svg ${a}><path d="M12 2s6 7.5 6 12a6 6 0 0 1-12 0c0-4.5 6-12 6-12z"/></svg>`;
    case "party": return `<svg ${a}><path d="M5 3l3 3M9 2l1 4M2 9l4 1"/><path d="M4 20l10-4L6 6z"/><circle cx="18" cy="6" r="1" fill="${color}"/><circle cx="20" cy="12" r="1" fill="${color}"/></svg>`;
    default: return "";
  }
}

function circuitsForDay(dayKey, week) {
  if (dayKey === "day2") {

    const map = { 1:["gc1"],2:["gc2"],3:["gc3"],4:["gc4"],5:["gc1","gc2"],6:["gc3","gc4"],7:["gc2","gc3"],8:["gc4","gc1"] };

    const out = [];
    if (text.includes("Running Circuit")) out.push(CIRCUITS.running);
    if (text.includes("Vacation Circuit")) out.push(CIRCUITS.vacation);
    if (text.includes("Dudley Circuit")) out.push(CIRCUITS.dudley);
    if (text.includes("Circuit Warm Up B")) out.push(WARMUPS.circuitB);
    else if (text.includes("Circuit Warm Up")) out.push(WARMUPS.circuitA);
    return out;
  }
  return [];
}

const TIMER_PRESETS = [
  { label: "Plyo 20\"/40\"", work: 20, rest: 40, rounds: 6 },
  { label: "Plyo 30\"/30\"", work: 30, rest: 30, rounds: 6 },
  { label: "Vacation 30\"/30\"", work: 30, rest: 30, rounds: 10 },
  { label: "Dudley 30\"/15\"", work: 30, rest: 15, rounds: 10 },
];

/* ---------------------------------------------------------------
   PERSISTENCE
----------------------------------------------------------------*/
function loadProgress(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveProgress(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

/* ---------------------------------------------------------------
   STATE
----------------------------------------------------------------*/
const state = {
  week: 1,
  activeTab: "day1",
  warmupChoice: "circuitA",
  checked: {},
};

function storageKey() { return `progress:w${state.week}:${state.activeTab}`; }

function loadStateForDay() {
  const val = loadProgress(storageKey());
  state.checked = (val && val.checked) || {};
  if (val && val.warmupChoice) state.warmupChoice = val.warmupChoice;
}

function persist() {
  saveProgress(storageKey(), { checked: state.checked, warmupChoice: state.warmupChoice });
}

/* ---------------------------------------------------------------
   TIMER
----------------------------------------------------------------*/
let timer = null; // { work, rest, rounds, round, phase, secondsLeft, running, intervalId, label, accent }

function beep(freq = 880, dur = 0.12) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.02);
  } catch (e) {}
}

function openTimer(preset, accent) {
  timer = { work: preset.work, rest: preset.rest, rounds: preset.rounds, round: 1, phase: "work", secondsLeft: preset.work, running: false, intervalId: null, label: preset.label, accent };
  render();
}
function closeTimer() {
  if (timer && timer.intervalId) clearInterval(timer.intervalId);
  timer = null;
  render();
}
function timerTick() {
  if (!timer) return;
  timer.secondsLeft -= 1;
  if (timer.secondsLeft <= 0) {
    if (timer.phase === "work") {
      beep(660);
      if (timer.rest > 0) { timer.phase = "rest"; timer.secondsLeft = timer.rest; }
      else if (timer.round >= timer.rounds) { timer.phase = "done"; stopTimer(); beep(440, 0.3); }
      else { timer.round += 1; timer.secondsLeft = timer.work; }
    } else if (timer.phase === "rest") {
      if (timer.round >= timer.rounds) { timer.phase = "done"; stopTimer(); beep(440, 0.3); }
      else { beep(990); timer.round += 1; timer.phase = "work"; timer.secondsLeft = timer.work; }
    }
  }
  renderTimerModal();
}
function startTimer() {
  if (!timer || timer.phase === "done") return;
  timer.running = true;
  timer.intervalId = setInterval(timerTick, 1000);
  renderTimerModal();
}
function stopTimer() {
  if (!timer) return;
  timer.running = false;
  if (timer.intervalId) clearInterval(timer.intervalId);
  timer.intervalId = null;
}
function toggleTimer() { if (!timer) return; timer.running ? stopTimer() : startTimer(); renderTimerModal(); }
function resetTimer() {
  if (!timer) return;
  stopTimer();
  timer.round = 1; timer.phase = "work"; timer.secondsLeft = timer.work;
  renderTimerModal();
}

/* ---------------------------------------------------------------
   RENDER
----------------------------------------------------------------*/
function checklistHtml(items, checkedMap, accent, groupAttr) {
  return `<ul class="checklist">${items.map((item, i) => {
    if (item.startsWith("→")) {
      return `<li class="arrow-line">${item}</li>`;
    }
    const done = !!checkedMap[i];
    return `<li>
      <button class="item-btn" data-action="toggle" ${groupAttr} data-index="${i}">
        <span class="check-circle" style="border-color:${done ? accent : "rgba(20,17,15,0.25)"};background-color:${done ? accent : "transparent"}">
          ${done ? icon("check", { size: 11, color: "#fff", strokeWidth: 3.5 }) : ""}
        </span>
        <span class="item-label ${done ? "done" : ""}">${item}</span>
      </button>
    </li>`;
  }).join("")}</ul>`;
}

function render() {
  const accent = ACCENT[state.activeTab];
  const isRecovery = state.activeTab === "recovery";
  const dayObj = TAB_DATA[state.activeTab];

  // header
  const laneCells = WEEKS.map((w) => {
    const bg = w === state.week ? accent : (w < state.week ? "#3A362F" : "#F5F1E8");
    const op = w === state.week ? 1 : (w < state.week ? 1 : 0.14);
    return `<button class="lane-cell" data-action="set-week" data-week="${w}" style="background-color:${bg};opacity:${op}">
      ${w === state.week ? `<span class="num">${w}</span>` : ""}
    </button>`;
  }).join("");
  const ticks = WEEKS.map((w) => `<div class="tick-cell"><div class="tick" style="height:${w % 5 === 0 ? 6 : 3}px"></div></div>`).join("");

  const headerHtml = `
    <header class="top">
      <div class="top-row">
        <div>
          <p class="eyebrow" style="color:${accent}">Northeastern Track &amp; Field</p>
          <h1 class="title">Summer Training</h1>
          <p class="subtitle">Triple Jump build</p>
        </div>
        <div class="week-badge"><span>Wk</span><span class="tabular">${state.week}</span></div>
      </div>
      <div class="lane-row">
        <button class="nav-arrow" data-action="week-prev">${icon("chevron-left", { size: 18, color: "rgba(245,241,232,0.5)" })}</button>
        <div class="lane-track">
          <div class="lane-cells">${laneCells}</div>
          <div class="ticks">${ticks}</div>
        </div>
        <button class="nav-arrow" data-action="week-next">${icon("chevron-right", { size: 18, color: "rgba(245,241,232,0.5)" })}</button>
      </div>
    </header>`;

  // main
  let mainHtml = "";
  if (!isRecovery) {
    const groups = circuitsForDay(state.activeTab, state.week);
    const totalBoxes = groups.reduce((sum, g) => sum + g.items.filter((it) => !it.startsWith("→")).length, 0);
    const doneBoxes = Object.values(state.checked).filter(Boolean).length;
    const dayComplete = totalBoxes > 0 && doneBoxes >= totalBoxes;

    mainHtml += `
      <div class="card">
        <div class="card-accent-bar" style="background-color:${accent}"></div>
        <div class="card-body">
          <h2>${dayObj.full}</h2>
          <p class="desc">${dayObj.base}</p>
          <div class="week-pill" style="background-color:${accent}12;border:1px solid ${accent}35">Week ${state.week}: ${dayObj.weeks[state.week]}</div>
          ${state.activeTab === "day4" ? `<a class="video-link" style="color:${accent}" href="${DAY4.lungeMatrixUrl}" target="_blank" rel="noreferrer">Lunge Matrix video ↗</a>` : ""}
        </div>
      </div>
      <div class="tj-note">
        <p class="label">Triple Jump Note</p>
        <p>${dayObj.tj}</p>
      </div>`;

    if (state.activeTab === "day1" || state.activeTab === "day3") {
      const warmupItems = WARMUPS[state.warmupChoice].items;
      const warmupChecked = Object.fromEntries(Object.entries(state.checked).filter(([k]) => k.startsWith("warmup-")).map(([k, v]) => [k.replace("warmup-", ""), v]));
      mainHtml += `
        <div class="card"><div class="card-body">
          <div class="warmup-header">
            <h3 style="margin:0">Warm Up</h3>
            <select class="warmup-select" id="warmupSelect">
              ${Object.entries(WARMUPS).map(([k, v]) => `<option value="${k}" ${k === state.warmupChoice ? "selected" : ""}>${v.name}</option>`).join("")}
            </select>
          </div>
          ${checklistHtml(warmupItems, warmupChecked, accent, `data-group="warmup"`)}
        </div></div>`;
    }

    if (totalBoxes > 0 && !dayComplete) {
      mainHtml += `
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, (doneBoxes / totalBoxes) * 100)}%;background-color:${accent}"></div></div>
          <span class="progress-count tabular">${doneBoxes}/${totalBoxes}</span>
        </div>`;
    }
    if (dayComplete) {
      mainHtml += `<div class="complete-banner" style="background-color:${accent}">${icon("party", { size: 18, color: "#fff" })}<p>Session logged. Nice work.</p></div>`;
    }

    groups.forEach((g, gi) => {
      const groupChecked = Object.fromEntries(Object.entries(state.checked).filter(([k]) => k.startsWith(`${gi}-`)).map(([k, v]) => [k.replace(`${gi}-`, ""), v]));
      mainHtml += `<div class="card"><div class="card-body"><h3>${g.name}</h3>${checklistHtml(g.items, groupChecked, accent, `data-group="${gi}"`)}</div></div>`;
    });

    if (state.activeTab === "day2" && state.week <= 8) {
      const presets = TIMER_PRESETS.filter((p) => (state.week <= 4 ? p.label.includes("20") : (p.label.includes("30") && p.label.includes("Plyo"))));
      mainHtml += `
        <div class="card"><div class="card-body">
          <div class="timer-header">${icon("timer", { size: 16, color: accent })}<h3 style="margin:0">Plyo Timer</h3></div>
          <p class="timer-hint">${state.week <= 4 ? "This week uses 20\"/40\" intervals." : "This week uses 30\"/30\" intervals."}</p>
          <div class="preset-grid">${presets.map((p) => `<button class="preset-btn" style="border:2px solid ${accent};color:${accent}" data-action="open-timer" data-work="${p.work}" data-rest="${p.rest}" data-rounds="${p.rounds}" data-label="${p.label}">${p.label}</button>`).join("")}</div>
        </div></div>`;
    }
    if (groups.some((g) => g.name.includes("Vacation")) || groups.some((g) => g.name.includes("Dudley"))) {
      const presets = TIMER_PRESETS.filter((p) => p.label.includes("Vacation") || p.label.includes("Dudley"));
      mainHtml += `
        <div class="card"><div class="card-body">
          <div class="timer-header">${icon("timer", { size: 16, color: accent })}<h3 style="margin:0">Circuit Timer</h3></div>
          <div class="preset-grid">${presets.map((p) => `<button class="preset-btn" style="border:2px solid ${accent};color:${accent}" data-action="open-timer" data-work="${p.work}" data-rest="${p.rest}" data-rounds="${p.rounds}" data-label="${p.label}">${p.label}</button>`).join("")}</div>
        </div></div>`;
    }
  } else {
    mainHtml += `
      <div class="card">
        <div class="card-accent-bar" style="background-color:${accent}"></div>
        <div class="card-body"><h2>${RECOVERY.full}</h2><p class="desc">${RECOVERY.text}</p></div>
      </div>
      <div class="tj-note recovery">${icon("droplet", { size: 18, color: "#2F6F5E" })}<p>${RECOVERY.tj}</p></div>
      <div class="card"><div class="card-body">
        <h3>Pick something</h3>
        <div class="chip-row">${RECOVERY.options.map((o) => `<span class="chip" style="background-color:${accent}12">${o}</span>`).join("")}</div>
      </div></div>`;
  }

  // tab bar
  const tabbarHtml = `
    <nav class="tabbar">
      ${TABS.map((key) => {
        const isActive = state.activeTab === key;
        const tabAccent = ACCENT[key];
        return `<button class="tab-btn" data-action="set-tab" data-tab="${key}">
          ${icon(TAB_ICON[key], { size: 19, color: isActive ? tabAccent : "rgba(20,17,15,0.35)", strokeWidth: isActive ? 2.4 : 1.8 })}
          <span class="tab-label" style="color:${isActive ? tabAccent : "rgba(20,17,15,0.35)"}">${TAB_DATA[key].label}</span>
          ${isActive ? `<span class="tab-dash" style="background-color:${tabAccent}"></span>` : ""}
        </button>`;
      }).join("")}
    </nav>`;

  document.getElementById("app").innerHTML = headerHtml + `<main>${mainHtml}</main>` + tabbarHtml + `<div id="timerModalRoot"></div>`;
  renderTimerModal();
}

function renderTimerModal() {
  const root = document.getElementById("timerModalRoot");
  if (!root) return;
  if (!timer) { root.innerHTML = ""; return; }

  const totalForPct = timer.phase === "work" ? timer.work : timer.rest;
  const pct = timer.phase === "done" ? 1 : (timer.secondsLeft / totalForPct);
  const phaseColor = timer.phase === "work" ? timer.accent : (timer.phase === "rest" ? "#2F6F5E" : "#8A8478");
  const circumference = 2 * Math.PI * 46;
  const dashoffset = circumference * (1 - (timer.phase === "done" ? 1 : pct));

  root.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="modal-top">
          <p>${timer.label}</p>
          <button data-action="close-timer">Close</button>
        </div>
        <div class="ring-wrap">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" fill="none" stroke="#E4DFD2" stroke-width="6"/>
            <circle cx="50" cy="50" r="46" fill="none" stroke="${phaseColor}" stroke-width="6"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dashoffset}" stroke-linecap="round"
              style="transition: stroke-dashoffset 1s linear"/>
          </svg>
          <div class="ring-center">
            <span class="ring-time tabular">${timer.phase === "done" ? "GO" : timer.secondsLeft}</span>
            <span class="ring-phase" style="color:${phaseColor}">${timer.phase === "done" ? "Complete" : timer.phase}</span>
          </div>
        </div>
        <p class="round-label">Round ${Math.min(timer.round, timer.rounds)} / ${timer.rounds}</p>
        <div class="modal-controls">
          <button class="round-btn" data-action="reset-timer">${icon("rotate-ccw", { size: 18, color: "#14110F" })}</button>
          <button class="play-btn" style="background-color:${timer.accent}" data-action="toggle-timer" ${timer.phase === "done" ? "disabled" : ""}>
            ${icon(timer.running ? "pause" : "play", { size: 22, color: "#fff" })}
          </button>
          <div style="width:52px"></div>
        </div>
      </div>
    </div>`;
}

/* ---------------------------------------------------------------
   EVENTS — delegated, so no re-binding needed after re-render
----------------------------------------------------------------*/
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "set-week") { state.week = Number(el.dataset.week); loadStateForDay(); render(); }
  else if (action === "week-prev") { state.week = Math.max(1, state.week - 1); loadStateForDay(); render(); }
  else if (action === "week-next") { state.week = Math.min(11, state.week + 1); loadStateForDay(); render(); }
  else if (action === "set-tab") { state.activeTab = el.dataset.tab; loadStateForDay(); render(); }
  else if (action === "toggle") {
    const key = `${el.dataset.group}-${el.dataset.index}`;
    state.checked[key] = !state.checked[key];
    persist();
    render();
  }
  else if (action === "open-timer") {
    openTimer({ work: Number(el.dataset.work), rest: Number(el.dataset.rest), rounds: Number(el.dataset.rounds), label: el.dataset.label }, ACCENT[state.activeTab]);
  }
  else if (action === "close-timer") { closeTimer(); }
  else if (action === "toggle-timer") { toggleTimer(); }
  else if (action === "reset-timer") { resetTimer(); }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "warmupSelect") {
    state.warmupChoice = e.target.value;
    persist();
    render();
  }
});

/* ---------------------------------------------------------------
   INIT
----------------------------------------------------------------*/
loadStateForDay();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
