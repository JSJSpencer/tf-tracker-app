/* ---------------------------------------------------------------
   h() — tiny hyperscript helper. Builds real DOM nodes directly
   (no HTML string concatenation), so there is no attribute-escaping
   class of bug possible: text always goes through textContent.
----------------------------------------------------------------*/
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  for (const key in attrs) {
    const val = attrs[key];
    if (val == null || val === false) continue;
    if (key === "class") node.className = val;
    else if (key === "style" && typeof val === "object") Object.assign(node.style, val);
    else if (key.startsWith("on") && typeof val === "function") node.addEventListener(key.slice(2).toLowerCase(), val);
    else if (key === "html") node.innerHTML = val; // only ever used with our own constant icon svg strings, never user data
    else node.setAttribute(key, String(val));
  }
  const flatten = (arr) => arr.reduce((acc, c) => Array.isArray(c) ? acc.concat(flatten(c)) : acc.concat([c]), []);
  flatten(children).forEach((child) => {
    if (child == null || child === false) return;
    if (typeof child === "string" || typeof child === "number") node.appendChild(document.createTextNode(String(child)));
    else node.appendChild(child);
  });
  return node;
}

  tj: "Good day to add short approach pop-ups (3-5 step run-in → hop-step-jump) after the circuit if you have access to a pit or soft landing — keeps rhythm sharp without more high hill/plyo impact.",
  lungeMatrixUrl: "https://youtu.be/GJo7_MiRLkU",
};

const RECOVERY = {
  label: "Recovery", full: "Days 5-7 — Active Recovery",
  text: "1-2x 20-30' easy recovery run. Use these days for you — mentally, physically, emotionally.",
  options: ["Meditate","Mobility / Stretch","Yoga","Pilates","Hike","Bike","Swim","Dance","Recovery Run","Cold/Hot Tub","Sauna","MB Circuit","PT","Chiropractor","Massage","Travel","Read","Sing","Relax","Cook"],
  tj: "Don't skip the ice baths (2x/week recommended) — triple jump landings add up fast over a week of hills + bounding. This is where you protect next week's training, not lose fitness.",
};

const TAB_DATA = { day1: DAY1, day2: DAY2, day3: DAY3, day4: DAY4, recovery: RECOVERY };
const TABS = ["day1", "day2", "day3", "day4", "recovery"];

function circuitsForDay(dayKey, week) {
  if (dayKey === "day2") {
    if (week === 9) return [WARMUPS.circuitA];
    if (week === 10) return [WARMUPS.circuitB];
    const map = {
      1:["gc1","mercury"], 2:["gc2","venus"], 3:["gc3","mars"], 4:["gc4","boundingA"],
      5:["gc1","gc2","mercury"], 6:["gc3","gc4","venus"], 7:["gc2","gc3","mars"], 8:["gc4","gc1","boundingA"],
    };
    return (map[week] || []).map((k) => CIRCUITS[k]);
  }
  if (dayKey === "day4") {
    const text = DAY4.weeks[week] || "";
    const out = [];
    if (text.includes("Running Circuit")) out.push(CIRCUITS.running);
    if (text.includes("Vacation Circuit")) out.push(CIRCUITS.vacation);
    if (text.includes("Dudley Circuit")) out.push(CIRCUITS.dudley);
    if (text.includes("Circuit Warm Up B")) out.push(WARMUPS.circuitB);
    else if (text.includes("Circuit Warm Up")) out.push(WARMUPS.circuitA);
    return out;
  }
  return [];
}

/* ---------------------------------------------------------------
   PERSISTENCE
----------------------------------------------------------------*/
function loadProgress(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveProgress(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

/* ---------------------------------------------------------------
   STATE
----------------------------------------------------------------*/
const state = { week: 1, activeTab: "day1", warmupChoice: "circuitA", checked: {} };
function storageKey() { return `progress:w${state.week}:${state.activeTab}`; }
function loadStateForDay() {
  const val = loadProgress(storageKey());
  state.checked = (val && val.checked) || {};
  if (val && val.warmupChoice) state.warmupChoice = val.warmupChoice;
}
function persist() { saveProgress(storageKey(), { checked: state.checked, warmupChoice: state.warmupChoice }); }

/* ---------------------------------------------------------------
   TIMER — cycles through the circuit's real exercise names, one
   work/rest interval per exercise, instead of a generic round count.
----------------------------------------------------------------*/
let timer = null;
function beep(freq, dur) {
  freq = freq || 880; dur = dur || 0.12;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.02);
  } catch (e) {}
}
// preset: { label, items: [exercise names, no arrow-lines], work, rest }
function openTimer(preset, accent) {
  timer = {
    label: preset.label,
    items: preset.items,
    work: preset.work,
    rest: preset.rest,
    index: 0,
    phase: "work",
    secondsLeft: preset.work,
    running: false,
    intervalId: null,
    accent,
  };
  render();
}
function closeTimer() { if (timer && timer.intervalId) clearInterval(timer.intervalId); timer = null; render(); }
function stopTimer() { if (!timer) return; timer.running = false; if (timer.intervalId) clearInterval(timer.intervalId); timer.intervalId = null; }
function timerTick() {
  if (!timer) return;
  const isLast = timer.index >= timer.items.length - 1;
  timer.secondsLeft -= 1;
  if (timer.secondsLeft <= 0) {
    if (timer.phase === "work") {
      beep(660);
      if (timer.rest > 0) { timer.phase = "rest"; timer.secondsLeft = timer.rest; }
      else if (isLast) { timer.phase = "done"; stopTimer(); beep(440, 0.3); }
      else { timer.index += 1; timer.phase = "work"; timer.secondsLeft = timer.work; }
    } else if (timer.phase === "rest") {
      if (isLast) { timer.phase = "done"; stopTimer(); beep(440, 0.3); }
      else { beep(990); timer.index += 1; timer.phase = "work"; timer.secondsLeft = timer.work; }
    }
  }
  renderTimerModal();
}
function startTimer() { if (!timer || timer.phase === "done") return; timer.running = true; timer.intervalId = setInterval(timerTick, 1000); renderTimerModal(); }
function toggleTimer() { if (!timer) return; timer.running ? stopTimer() : startTimer(); renderTimerModal(); }
function resetTimer() { if (!timer) return; stopTimer(); timer.index = 0; timer.phase = "work"; timer.secondsLeft = timer.work; renderTimerModal(); }

/* ---------------------------------------------------------------
   UI BUILDERS — every one returns a real DOM node via h()
----------------------------------------------------------------*/
function Checklist(items, checkedMap, accent, onToggle) {
  const ul = h("ul", { class: "checklist" });
  items.forEach((item, i) => {
    if (item.startsWith("→")) {
      ul.appendChild(h("li", { class: "arrow-line" }, item));
      return;
    }
    const done = !!checkedMap[i];
    const circle = h("span", {
      class: "check-circle",
      style: { borderColor: done ? accent : "rgba(20,17,15,0.25)", backgroundColor: done ? accent : "transparent" },
    }, done ? Icon("check", 11, "#fff", 3.5) : null);
    const label = h("span", { class: "item-label" + (done ? " done" : "") }, item);
    const btn = h("button", { class: "item-btn", onclick: () => onToggle(i) }, circle, label);
    ul.appendChild(h("li", {}, btn));
  });
  return ul;
}

function Header() {
  const accent = ACCENT[state.activeTab];
  const laneCells = h("div", { class: "lane-cells" });
  WEEKS.forEach((w) => {
    const bg = w === state.week ? accent : (w < state.week ? "#3A362F" : "#F5F1E8");
    const op = w === state.week ? "1" : (w < state.week ? "1" : "0.14");
    const cell = h("button", {
      class: "lane-cell",
      style: { backgroundColor: bg, opacity: op },
      onclick: () => { state.week = w; loadStateForDay(); render(); },
    }, w === state.week ? h("span", { class: "num" }, String(w)) : null);
    laneCells.appendChild(cell);
  });
  const ticks = h("div", { class: "ticks" });
  WEEKS.forEach((w) => {
    ticks.appendChild(h("div", { class: "tick-cell" }, h("div", { class: "tick", style: { height: (w % 5 === 0 ? "6px" : "3px") } })));
  });

  return h("header", { class: "top" },
    h("div", { class: "top-row" },
      h("div", {},
        h("p", { class: "eyebrow", style: { color: accent } }, "Northeastern Track & Field"),
        h("h1", { class: "title" }, "Summer Training"),
        h("p", { class: "subtitle" }, "Triple Jump build"),
      ),
      h("div", { class: "week-badge" }, h("span", {}, "Wk"), h("span", { class: "tabular" }, String(state.week))),
    ),
    h("div", { class: "lane-row" },
      h("button", { class: "nav-arrow", onclick: () => { state.week = Math.max(1, state.week - 1); loadStateForDay(); render(); } }, Icon("chevron-left", 18, "rgba(245,241,232,0.5)")),
      h("div", { class: "lane-track" }, laneCells, ticks),
      h("button", { class: "nav-arrow", onclick: () => { state.week = Math.min(11, state.week + 1); loadStateForDay(); render(); } }, Icon("chevron-right", 18, "rgba(245,241,232,0.5)")),
    ),
  );
}

function DayMain() {
  const accent = ACCENT[state.activeTab];
  const dayObj = TAB_DATA[state.activeTab];
  const frag = document.createDocumentFragment();
  const groups = circuitsForDay(state.activeTab, state.week);
  const totalBoxes = groups.reduce((sum, g) => sum + g.items.filter((it) => !it.startsWith("→")).length, 0);
  const doneBoxes = Object.values(state.checked).filter(Boolean).length;
  const dayComplete = totalBoxes > 0 && doneBoxes >= totalBoxes;

  const dayCardBody = h("div", { class: "card-body" },
    h("h2", {}, dayObj.full),
    h("p", { class: "desc" }, dayObj.base),
    h("div", { class: "week-pill", style: { backgroundColor: accent + "12", border: "1px solid " + accent + "35" } }, `Week ${state.week}: ${dayObj.weeks[state.week]}`),
  );
  if (state.activeTab === "day4") {
    dayCardBody.appendChild(h("a", { class: "video-link", style: { color: accent }, href: DAY4.lungeMatrixUrl, target: "_blank", rel: "noreferrer" }, "Lunge Matrix video ↗"));
  }
  frag.appendChild(h("div", { class: "card" }, h("div", { class: "card-accent-bar", style: { backgroundColor: accent } }), dayCardBody));

  frag.appendChild(h("div", { class: "tj-note" }, h("p", { class: "label" }, "Triple Jump Note"), h("p", {}, dayObj.tj)));

  if (state.activeTab === "day1" || state.activeTab === "day3") {
    const select = h("select", { class: "warmup-select" });
    Object.entries(WARMUPS).forEach(([k, v]) => {
      const opt = h("option", { value: k }, v.name);
      if (k === state.warmupChoice) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener("change", (e) => { state.warmupChoice = e.target.value; persist(); render(); });

    const warmupChecked = Object.fromEntries(Object.entries(state.checked).filter(([k]) => k.startsWith("warmup-")).map(([k, v]) => [k.replace("warmup-", ""), v]));
    const list = Checklist(WARMUPS[state.warmupChoice].items, warmupChecked, accent, (i) => {
      const key = `warmup-${i}`;
      state.checked[key] = !state.checked[key];
      persist();
      render();
    });
    frag.appendChild(h("div", { class: "card" }, h("div", { class: "card-body" },
      h("div", { class: "warmup-header" }, h("h3", { style: { margin: "0" } }, "Warm Up"), select),
      list,
    )));
  }

  if (totalBoxes > 0 && !dayComplete) {
    const fill = h("div", { class: "progress-fill", style: { width: `${Math.min(100, (doneBoxes / totalBoxes) * 100)}%`, backgroundColor: accent } });
    frag.appendChild(h("div", { class: "progress-row" }, h("div", { class: "progress-track" }, fill), h("span", { class: "progress-count tabular" }, `${doneBoxes}/${totalBoxes}`)));
  }
  if (dayComplete) {
    frag.appendChild(h("div", { class: "complete-banner", style: { backgroundColor: accent } }, Icon("party", 18, "#fff"), h("p", {}, "Session logged. Nice work.")));
  }

  groups.forEach((g, gi) => {
    const groupChecked = Object.fromEntries(Object.entries(state.checked).filter(([k]) => k.startsWith(`${gi}-`)).map(([k, v]) => [k.replace(`${gi}-`, ""), v]));
    const list = Checklist(g.items, groupChecked, accent, (i) => {
      const key = `${gi}-${i}`;
      state.checked[key] = !state.checked[key];
      persist();
      render();
    });
    frag.appendChild(h("div", { class: "card" }, h("div", { class: "card-body" }, h("h3", {}, g.name), list)));
  });

  function timerCard(title, presets) {
    const grid = h("div", { class: "preset-grid" });
    presets.forEach((p) => {
      grid.appendChild(h("button", {
        class: "preset-btn",
        style: { border: `2px solid ${accent}`, color: accent },
        onclick: () => openTimer(p, accent),
      }, p.label));
    });
    return h("div", { class: "card" }, h("div", { class: "card-body" },
      h("div", { class: "timer-header" }, Icon("timer", 16, accent), h("h3", { style: { margin: "0" } }, title)),
      grid,
    ));
  }

  const PLYO_WEEK_MAP = { 1: "mercury", 2: "venus", 3: "mars", 4: "boundingA", 5: "mercury", 6: "venus", 7: "mars", 8: "boundingA" };
  if (state.activeTab === "day2" && PLYO_WEEK_MAP[state.week]) {
    const circuitKey = PLYO_WEEK_MAP[state.week];
    const circuit = CIRCUITS[circuitKey];
    const work = state.week <= 4 ? 20 : 30;
    const rest = state.week <= 4 ? 40 : 30;
    const preset = { label: `${circuit.name} — ${work}"/${rest}"`, items: circuit.items, work, rest };
    const card = timerCard("Plyo Timer", [preset]);
    card.querySelector(".card-body").insertBefore(
      h("p", { class: "timer-hint" }, `Cycles through ${circuit.items.length} ${circuit.name} exercises, naming each one as it goes.`),
      card.querySelector(".preset-grid"),
    );
    frag.appendChild(card);
  }

  const vacationGroup = groups.find((g) => g.name.includes("Vacation"));
  const dudleyGroup = groups.find((g) => g.name.includes("Dudley"));
  if (vacationGroup || dudleyGroup) {
    const presets = [];
    if (vacationGroup) presets.push({ label: 'Vacation — 30"/30"', items: vacationGroup.items, work: 30, rest: 30 });
    if (dudleyGroup) presets.push({ label: 'Dudley — 30"/15"', items: dudleyGroup.items, work: 30, rest: 15 });
    frag.appendChild(timerCard("Circuit Timer", presets));
  }

  return frag;
}

function RecoveryMain() {
  const accent = ACCENT.recovery;
  const frag = document.createDocumentFragment();
  frag.appendChild(h("div", { class: "card" },
    h("div", { class: "card-accent-bar", style: { backgroundColor: accent } }),
    h("div", { class: "card-body" }, h("h2", {}, RECOVERY.full), h("p", { class: "desc" }, RECOVERY.text)),
  ));
  frag.appendChild(h("div", { class: "tj-note recovery" }, Icon("droplet", 18, "#2F6F5E"), h("p", {}, RECOVERY.tj)));
  const chipRow = h("div", { class: "chip-row" });
  RECOVERY.options.forEach((o) => chipRow.appendChild(h("span", { class: "chip", style: { backgroundColor: accent + "12" } }, o)));
  frag.appendChild(h("div", { class: "card" }, h("div", { class: "card-body" }, h("h3", {}, "Pick something"), chipRow)));
  return frag;
}

function TabBar() {
  const nav = h("nav", { class: "tabbar" });
  TABS.forEach((key) => {
    const isActive = state.activeTab === key;
    const tabAccent = ACCENT[key];
    const color = isActive ? tabAccent : "rgba(20,17,15,0.35)";
    const btn = h("button", { class: "tab-btn", onclick: () => { state.activeTab = key; loadStateForDay(); render(); } },
      Icon(TAB_ICON[key], 19, color, isActive ? 2.4 : 1.8),
      h("span", { class: "tab-label", style: { color } }, TAB_DATA[key].label),
    );
    if (isActive) btn.appendChild(h("span", { class: "tab-dash", style: { backgroundColor: tabAccent } }));
    nav.appendChild(btn);
  });
  return nav;
}

function TimerModal() {
  if (!timer) return null;
  const totalForPct = timer.phase === "work" ? timer.work : timer.rest;
  const pct = timer.phase === "done" ? 1 : (timer.secondsLeft / totalForPct);
  const phaseColor = timer.phase === "work" ? timer.accent : (timer.phase === "rest" ? "#2F6F5E" : "#8A8478");
  const circumference = 2 * Math.PI * 46;
  const dashoffset = circumference * (1 - (timer.phase === "done" ? 1 : pct));

  const svgNs = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNs, "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  const bgCircle = document.createElementNS(svgNs, "circle");
  bgCircle.setAttribute("cx", "50"); bgCircle.setAttribute("cy", "50"); bgCircle.setAttribute("r", "46");
  bgCircle.setAttribute("fill", "none"); bgCircle.setAttribute("stroke", "#E4DFD2"); bgCircle.setAttribute("stroke-width", "6");
  const fgCircle = document.createElementNS(svgNs, "circle");
  fgCircle.setAttribute("cx", "50"); fgCircle.setAttribute("cy", "50"); fgCircle.setAttribute("r", "46");
  fgCircle.setAttribute("fill", "none"); fgCircle.setAttribute("stroke", phaseColor); fgCircle.setAttribute("stroke-width", "6");
  fgCircle.setAttribute("stroke-dasharray", String(circumference));
  fgCircle.setAttribute("stroke-dashoffset", String(dashoffset));
  fgCircle.setAttribute("stroke-linecap", "round");
  fgCircle.style.transition = "stroke-dashoffset 1s linear";
  svg.appendChild(bgCircle); svg.appendChild(fgCircle);

  const ringCenter = h("div", { class: "ring-center" },
    h("span", { class: "ring-time tabular" }, timer.phase === "done" ? "GO" : String(timer.secondsLeft)),
    h("span", { class: "ring-phase", style: { color: phaseColor } }, timer.phase === "done" ? "Complete" : timer.phase),
  );
  const ringWrap = h("div", { class: "ring-wrap" });
  ringWrap.appendChild(svg);
  ringWrap.appendChild(ringCenter);

  const playBtn = h("button", {
    class: "play-btn",
    style: { backgroundColor: timer.accent },
    onclick: toggleTimer,
  }, Icon(timer.running ? "pause" : "play", 22, "#fff"));
  if (timer.phase === "done") playBtn.disabled = true;

  const exerciseName = timer.items[timer.index];
  const nextExerciseName = timer.index + 1 < timer.items.length ? timer.items[timer.index + 1] : null;
  let mainLine;
  if (timer.phase === "done") mainLine = "Workout complete";
  else if (timer.phase === "rest") mainLine = nextExerciseName ? `Up next: ${nextExerciseName}` : "Rest";
  else mainLine = exerciseName;
  const countLine = `${Math.min(timer.index + 1, timer.items.length)} / ${timer.items.length}`;

  return h("div", { class: "modal-overlay" },
    h("div", { class: "modal-box" },
      h("div", { class: "modal-top" }, h("p", {}, timer.label), h("button", { onclick: closeTimer }, "Close")),
      ringWrap,
      h("p", { class: "exercise-name" }, mainLine),
      h("p", { class: "round-label" }, countLine),
      h("div", { class: "modal-controls" },
        h("button", { class: "round-btn", onclick: resetTimer }, Icon("rotate-ccw", 18, "#14110F")),
        playBtn,
        h("div", { style: { width: "52px" } }),
      ),
    ),
  );
}

/* ---------------------------------------------------------------
   RENDER
----------------------------------------------------------------*/
function render() {
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(Header());
  const main = h("main", {});
  main.appendChild(state.activeTab === "recovery" ? RecoveryMain() : DayMain());
  root.appendChild(main);
  root.appendChild(TabBar());
  root.appendChild(h("div", { id: "timerModalRoot" }));
  renderTimerModal();
}

function renderTimerModal() {
  const root = document.getElementById("timerModalRoot");
  if (!root) return;
  root.innerHTML = "";
  const modal = TimerModal();
  if (modal) root.appendChild(modal);
}

/* ---------------------------------------------------------------
   INIT
----------------------------------------------------------------*/
loadStateForDay();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
