<div id="app"></div>

<script>
"use strict";

/* ---------------------------------------------------------------
   h() — tiny hyperscript helper. Builds real DOM nodes directly
   (no HTML string concatenation), so there is no attribute-escaping
   class of bug possible: text always goes through textContent.
----------------------------------------------------------------*/
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  for (const key in attrs) {
    const val = attrs[key];
    if (val == null || val === false) continue;
    if (key === "class") node.className = val;
    else if (key === "style" && typeof val === "object") Object.assign(node.style, val);
    else if (key.startsWith("on") && typeof val === "function") node.addEventListener(key.slice(2).toLowerCase(), val);
    else if (key === "html") node.innerHTML = val; // only ever used with our own constant icon svg strings, never user data
    else node.setAttribute(key, String(val));
  }
  const flatten = (arr) => arr.reduce((acc, c) => Array.isArray(c) ? acc.concat(flatten(c)) : acc.concat([c]), []);
  flatten(children).forEach((child) => {
    if (child == null || child === false) return;
    if (typeof child === "string" || typeof child === "number") node.appendChild(document.createTextNode(String(child)));
    else node.appendChild(child);
  });
  return node;
}

/* ---------- inline icon set — constant SVG strings, never mixed with user data ---------- */
function iconSvg(name, size, color, strokeWidth) {
  size = size || 18; color = color || "currentColor"; strokeWidth = strokeWidth || 2;
  const a = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round"`;
  const table = {
    check: `<svg ${a}><polyline points="20 6 9 17 4 12"/></svg>`,
    timer: `<svg ${a}><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>`,
    play: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>`,
    pause: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
    "rotate-ccw": `<svg ${a}><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`,
    "chevron-left": `<svg ${a}><polyline points="15 18 9 12 15 6"/></svg>`,
    "chevron-right": `<svg ${a}><polyline points="9 18 15 12 9 6"/></svg>`,
    zap: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
    "refresh-cw": `<svg ${a}><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>`,
    mountain: `<svg ${a}><path d="M3 20l7-11 4 6 3-4 4 9H3z"/></svg>`,
    move: `<svg ${a}><path d="M4 12h16"/><path d="M4 12l4-4M4 12l4 4"/><path d="M20 12l-4-4M20 12l-4 4"/><path d="M12 4v16"/></svg>`,
    leaf: `<svg ${a}><path d="M11 20A7 7 0 0 1 4 13c0-5 8-11 15-11 0 8-4 18-8 18z"/><path d="M4 13c4 0 8-2 11-9"/></svg>`,
    droplet: `<svg ${a}><path d="M12 2s6 7.5 6 12a6 6 0 0 1-12 0c0-4.5 6-12 6-12z"/></svg>`,
    party: `<svg ${a}><path d="M5 3l3 3M9 2l1 4M2 9l4 1"/><path d="M4 20l10-4L6 6z"/><circle cx="18" cy="6" r="1" fill="${color}"/><circle cx="20" cy="12" r="1" fill="${color}"/></svg>`,
    calendar: `<svg ${a}><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
    search: `<svg ${a}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
    hurdle: `<svg ${a}><path d="M4 20V9M20 20V9M4 9h16"/><path d="M8 20h-3M19 20h-3"/></svg>`,
  };
  return table[name] || "";
}
function Icon(name, size, color, strokeWidth) {
  const span = document.createElement("span");
  span.style.display = "inline-flex";
  span.innerHTML = iconSvg(name, size, color, strokeWidth);
  return span;
}

/* ---------------------------------------------------------------
   DATA — Summer Training Package, annotated for triple jump
----------------------------------------------------------------*/
const WEEKS = Array.from({ length: 11 }, (_, i) => i + 1);
const ACCENT = { day1: "#C1440E", day2: "#3E6E92", day3: "#6B4A2C", day4: "#B8862E", day5: "#7A5C8E", recovery: "#2F6F5E" };
const TAB_ICON = { day1: "zap", day2: "refresh-cw", day3: "mountain", day4: "hurdle", day5: "move", recovery: "leaf" };

/* ---------------------------------------------------------------
   CIRCUITS & WARMUPS — loaded at runtime from circuits/*.json and
   warmups/*.json, same pattern as phases. To add a new circuit or
   warm-up: drop a new file (shape: {"key","name","items"}) into
   the folder and add its filename to that folder's manifest.json.
   index.html never needs to change.
----------------------------------------------------------------*/
let CIRCUITS = {};
let WARMUPS = {};

async function loadLibrary(folder, targetObj) {
  const res = await fetch(folder + "/manifest.json");
  if (!res.ok) throw new Error(folder + " manifest fetch failed: " + res.status);
  const files = await res.json();
  for (const file of files) {
    try {
      const r = await fetch(folder + "/" + file);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (!data.key) continue;
      targetObj[data.key] = { name: data.name, items: data.items, timer: data.timer || null };
    } catch (e) {
      console.error("Failed to load " + folder + " file:", file, e);
    }
  }
}

/* ---------------------------------------------------------------
   PHASES — loaded at runtime from phases/manifest.json + the JSON
   files it lists. To add a new phase: drop a new phases/xyz.json
   (same shape as phases/summer.json) into the phases folder and
   add its filename to phases/manifest.json. index.html itself
   never needs to change.
----------------------------------------------------------------*/
let PHASES = {};
let PHASE_ORDER = [];
let phasesLoadError = null;

async function loadPhases() {
  const res = await fetch("phases/manifest.json");
  if (!res.ok) throw new Error("manifest fetch failed: " + res.status);
  const files = await res.json();
  for (const file of files) {
    try {
      const r = await fetch("phases/" + file);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (!data.key) continue;
      PHASES[data.key] = data;
      PHASE_ORDER.push(data.key);
    } catch (e) {
      console.error("Failed to load phase file:", file, e);
    }
  }
}

const TABS = ["day1", "day2", "day3", "day4", "day5", "recovery"];
const TAB_FALLBACK_LABEL = { day1: "Day 1", day2: "Day 2", day3: "Day 3", day4: "Day 4", day5: "Day 5", recovery: "Recovery" };

function currentPhase() { return PHASES[state.phase]; }
function getDayObj(tabKey) {
  const phase = currentPhase();
  if (!phase) return null;
  if (tabKey === "recovery") return phase.recovery;
  return phase.days[tabKey] || null;
}
function tabLabel(tabKey) {
  const obj = getDayObj(tabKey);
  return obj ? obj.label : TAB_FALLBACK_LABEL[tabKey];
}

function circuitsForDay(dayKey, week) {
  if (state.phase !== "summer") return [];
  if (dayKey === "day2") {
    if (week === 9) return [WARMUPS.circuitA];
    if (week === 10) return [WARMUPS.circuitB];
    const map = {
      1:["gc1","mercury"], 2:["gc2","venus"], 3:["gc3","mars"], 4:["gc4","boundingA"],
      5:["gc1","gc2","mercury"], 6:["gc3","gc4","venus"], 7:["gc2","gc3","mars"], 8:["gc4","gc1","boundingA"],
    };
    const sequence = map[week] || [];
    if (sequence.length === 0) return [];
    // LJ/TJ warmup slots between the general circuit(s) and the plyo block
    const withWarmup = [...sequence];
    withWarmup.splice(withWarmup.length - 1, 0, "__ljtj__");
    return withWarmup.map((k) => (k === "__ljtj__" ? WARMUPS.ljtj : CIRCUITS[k]));
  }
  if (dayKey === "day4") {
    return [WARMUPS.ljtj];
  }
  if (dayKey === "day5") {
    const text = (PHASES.summer.days.day5.weeks[week]) || "";
    const out = [];
    if (text.includes("Running Circuit")) out.push(CIRCUITS.running);
    if (text.includes("Vacation Circuit")) out.push(CIRCUITS.vacation);
    if (text.includes("Dudley Circuit")) out.push(CIRCUITS.dudley);
    if (text.includes("Circuit Warm Up B")) out.push(WARMUPS.circuitB);
    else if (text.includes("Circuit Warm Up")) out.push(WARMUPS.circuitA);
    return out;
  }
  return [];
}

/* ---------------------------------------------------------------
   PERSISTENCE
----------------------------------------------------------------*/
function loadProgress(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveProgress(key, value) {

/* ---------------------------------------------------------------
   REP CHECKLIST — optional, parses "N x thing" prescriptions into
   checkable reps, same idea as the warm-up checklist.
----------------------------------------------------------------*/
function parseReps(text) {
  if (!text) return null;
  const m = text.match(/^(\d+)\s*x\s*(.+)$/i);
  if (!m) return null;
  const count = parseInt(m[1], 10);
  if (!count || count < 1 || count > 30) return null;
  return { count, desc: m[2].trim() };
}
function repChecklistPrefKey(tabKey) { return `prefs:repChecklist:${tabKey}`; }

/* ---------------------------------------------------------------
   TIMER — cycles through the circuit's real exercise names, one
   work/rest interval per exercise, instead of a generic round count.
----------------------------------------------------------------*/
let timer = null;

// One persistent AudioContext, unlocked by the user's tap on Play.
// iOS suspends any AudioContext created outside a direct user gesture,
// so creating a fresh one inside the setInterval tick (as before) meant
// beeps were silently never actually audible. Reusing a context that
// was resumed during a real tap keeps working for subsequent interval
// ticks too, since it's the same already-running context.
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function beep(freq, dur) {
  freq = freq || 880; dur = dur || 0.12;
  try {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start();
    osc.stop(audioCtx.currentTime + dur + 0.02);
  } catch (e) {}
}

// Wake Lock — keeps the screen on while a timer is actively running.
// Requires a secure context (https, which real deployments use) and is
// released automatically by the browser whenever the tab is hidden, so
// we re-acquire it on visibilitychange if the timer is still running.
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* not supported, denied, or low battery — ignore */ }
}
function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && timer && timer.running && !wakeLock) {
    acquireWakeLock();
  }
});

// preset: { label, items: [exercise names, no arrow-lines], work, rest }
function openTimer(preset, accent) {
  timer = {
    label: preset.label,
    items: preset.items,
    work: preset.work,
    rest: preset.rest,
    index: 0,
    phase: "work",
    secondsLeft: preset.work,
    running: false,
    intervalId: null,
    accent,
  };
  render();
}
function closeTimer() {
  if (timer && timer.intervalId) clearInterval(timer.intervalId);
  releaseWakeLock();
  timer = null;
  render();
}
function stopTimer() {
  if (!timer) return;
  timer.running = false;
  if (timer.intervalId) clearInterval(timer.intervalId);
  timer.intervalId = null;
  releaseWakeLock();
}
function timerTick() {
  if (!timer) return;
  const isLast = timer.index >= timer.items.length - 1;
  timer.secondsLeft -= 1;
  if (timer.secondsLeft <= 0) {
    if (timer.phase === "work") {
      beep(660);
      if (timer.rest > 0) { timer.phase = "rest"; timer.secondsLeft = timer.rest; }
      else if (isLast) { timer.phase = "done"; stopTimer(); beep(440, 0.3); }
      else { timer.index += 1; timer.phase = "work"; timer.secondsLeft = timer.work; }
    } else if (timer.phase === "rest") {
      if (isLast) { timer.phase = "done"; stopTimer(); beep(440, 0.3); }
      else { beep(990); timer.index += 1; timer.phase = "work"; timer.secondsLeft = timer.work; }
    }
  }
  renderTimerModal();
}
function startTimer() {
  if (!timer || timer.phase === "done") return;
  unlockAudio();
  acquireWakeLock();
  timer.running = true;
  timer.intervalId = setInterval(timerTick, 1000);
  renderTimerModal();
}
function toggleTimer() { if (!timer) return; timer.running ? stopTimer() : startTimer(); renderTimerModal(); }
function resetTimer() { if (!timer) return; stopTimer(); timer.index = 0; timer.phase = "work"; timer.secondsLeft = timer.work; renderTimerModal(); }

  items.forEach((item, i) => {
    if (item.startsWith("→")) {
      ul.appendChild(h("li", { class: "arrow-line" }, item));

    const done = !!checkedMap[i];
    const circle = h("span", {
      class: "check-circle",

}

function TimerModal() {

  const phaseColor = timer.phase === "work" ? timer.accent : (timer.phase === "rest" ? "#2F6F5E" : "#8A8478");
  const circumference = 2 * Math.PI * 46;
  const dashoffset = circumference * (1 - (timer.phase === "done" ? 1 : pct));

  const svgNs = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNs, "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  const bgCircle = document.createElementNS(svgNs, "circle");
  bgCircle.setAttribute("cx", "50"); bgCircle.setAttribute("cy", "50"); bgCircle.setAttribute("r", "46");
  bgCircle.setAttribute("fill", "none"); bgCircle.setAttribute("stroke", "#E4DFD2"); bgCircle.setAttribute("stroke-width", "6");
  const fgCircle = document.createElementNS(svgNs, "circle");
  fgCircle.setAttribute("cx", "50"); fgCircle.setAttribute("cy", "50"); fgCircle.setAttribute("r", "46");
  fgCircle.setAttribute("fill", "none"); fgCircle.setAttribute("stroke", phaseColor); fgCircle.setAttribute("stroke-width", "6");
  fgCircle.setAttribute("stroke-dasharray", String(circumference));
  fgCircle.setAttribute("stroke-dashoffset", String(dashoffset));
  fgCircle.setAttribute("stroke-linecap", "round");
  fgCircle.style.transition = "stroke-dashoffset 1s linear";
  svg.appendChild(bgCircle); svg.appendChild(fgCircle);

  const playBtn = h("button", {

  const exerciseName = timer.items[timer.index];

  let mainLine;
  if (timer.phase === "done") mainLine = "Workout complete";
  else if (timer.phase === "rest") mainLine = nextExerciseName ? `Up next: ${nextExerciseName}` : "Rest";
  else mainLine = exerciseName;

        playBtn,
        h("div", { style: { width: "52px" } }),

    ),
  );

  if (!state.historyOpen) return null;
  const phase = currentPhase();
  const weeksArr = Array.from({ length: phase.weeksCount }, (_, i) => i + 1);

  const grid = h("div", { class: "history-grid" });
  grid.appendChild(h("div", {}));
  TABS.forEach((key) => {
    grid.appendChild(h("div", { class: "history-col-label" }, tabLabel(key).slice(0, 2)));
  });
  weeksArr.forEach((w) => {
    grid.appendChild(h("div", { class: "history-week-label" }, `W${w}`));
    TABS.forEach((key) => {
      const done = isDayDone(state.phase, w, key);
      const cell = h("button", {
        class: "history-cell" + (done ? " done" : ""),
        style: done ? { "--cell-accent": ACCENT[key] } : {},
        onclick: () => {
          setDayDone(state.phase, w, key, !done);
          renderHistoryModal();
        },
      }, done ? Icon("check", 12, "#fff", 3) : null);
      grid.appendChild(cell);
    });
  });

  return h("div", { class: "history-overlay" },
    h("div", { class: "history-box" },
      h("div", { class: "history-top" }, h("h3", {}, "Training Log"), h("button", { onclick: () => { state.historyOpen = false; render(); } }, "Close")),
      h("p", { class: "history-sub" }, `${phase.label} — tap a cell to mark or unmark that day`),
      grid,
    ),
  );
}

/* ---------------------------------------------------------------
   CATALOG — a searchable browser for every circuit and warm-up,
   independent of phase. Handy for checking whether something you
   just added actually loaded, without needing to be on a day that
   happens to use it.
----------------------------------------------------------------*/
function catalogSection(title, entries, query) {
  const q = query.trim().toLowerCase();
  const matches = Object.entries(entries).filter(([key, v]) => !q || v.name.toLowerCase().includes(q));
  if (matches.length === 0) return null;

  const section = h("div", {});
  section.appendChild(h("p", { class: "catalog-section-title" }, `${title} (${matches.length})`));
  matches.forEach(([key, v]) => {
    const expandKey = title + ":" + key;
    const isOpen = q ? true : !!state.catalogExpanded[expandKey];
    const header = h("button", {
      class: "catalog-item-header",
      onclick: () => {
        state.catalogExpanded[expandKey] = !state.catalogExpanded[expandKey];
        renderCatalogModal();
      },
    },
      h("span", { class: "name" }, v.name),
      h("span", { class: "count" }, v.timer ? `${v.timer.work}"/${v.timer.rest || 0}" · ${v.items.length}` : `${v.items.length} →`),
    );
    const body = isOpen ? h("div", { class: "catalog-item-body" },
      h("ul", {}, ...v.items.map((item) =>
        h("li", { class: item.startsWith("→") ? "arrow-line" : "" }, item)
      )),
    ) : null;
    section.appendChild(h("div", { class: "catalog-item" }, header, body));
  });
  return section;
}

function CatalogModal() {
  if (!state.catalogOpen) return null;

  const searchInput = h("input", {
    class: "catalog-search",
    type: "text",
    placeholder: "Search circuits & warm-ups…",
    value: state.catalogQuery,
  });
  searchInput.addEventListener("input", (e) => { state.catalogQuery = e.target.value; renderCatalogModal(); });

  const body = h("div", {});
  const circuitsSection = catalogSection("Circuits", CIRCUITS, state.catalogQuery);
  const warmupsSection = catalogSection("Warm-Ups", WARMUPS, state.catalogQuery);
  if (circuitsSection) body.appendChild(circuitsSection);
  if (warmupsSection) body.appendChild(warmupsSection);
  if (!circuitsSection && !warmupsSection) {
    body.appendChild(h("p", { class: "catalog-empty" }, `Nothing matches "${state.catalogQuery}".`));
  }

  const box = h("div", { class: "history-box" },
    h("div", { class: "history-top" }, h("h3", {}, "Circuit & Warm-Up Catalog"), h("button", { onclick: () => { state.catalogOpen = false; state.catalogQuery = ""; render(); } }, "Close")),
    h("p", { class: "history-sub" }, `${Object.keys(CIRCUITS).length} circuits, ${Object.keys(WARMUPS).length} warm-ups loaded — tap any name to see its exercises`),
    searchInput,
    body,
  );
  return h("div", { class: "history-overlay" }, box);
}

/* ---------------------------------------------------------------
   RENDER
----------------------------------------------------------------*/
function render() {
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(Header());
  const main = h("main", {});
  main.appendChild(state.activeTab === "recovery" ? RecoveryMain() : DayMain());
  root.appendChild(main);
  root.appendChild(TabBar());
  root.appendChild(h("div", { id: "timerModalRoot" }));
  root.appendChild(h("div", { id: "historyModalRoot" }));
  root.appendChild(h("div", { id: "catalogModalRoot" }));
  renderTimerModal();
  renderHistoryModal();
  renderCatalogModal();
}

function renderCatalogModal() {
  const root = document.getElementById("catalogModalRoot");
  if (!root) return;
  root.innerHTML = "";
  const modal = CatalogModal();
  if (modal) root.appendChild(modal);
  if (state.catalogOpen) {
    const input = root.querySelector(".catalog-search");
    if (input) {
      input.focus();
      input.selectionStart = input.selectionEnd = input.value.length;
    }
  }
}

function renderTimerModal() {
  const root = document.getElementById("timerModalRoot");
  if (!root) return;
  root.innerHTML = "";
  const modal = TimerModal();
  if (modal) root.appendChild(modal);
}

function renderHistoryModal() {
  const root = document.getElementById("historyModalRoot");
  if (!root) return;
  root.innerHTML = "";
  const modal = HistoryModal();
  if (modal) root.appendChild(modal);
}

/* ---------------------------------------------------------------
   INIT
----------------------------------------------------------------*/
function renderLoading() {
  document.getElementById("app").innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F1E8;color:rgba(20,17,15,0.5);font-size:14px;">Loading program…</div>';
}
function renderLoadError(err) {
  document.getElementById("app").innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:#F5F1E8;color:#14110F;font-size:14px;padding:24px;text-align:center;">' +
    '<strong>Couldn\'t load the training program.</strong>' +
    '<span style="color:rgba(20,17,15,0.6);font-size:13px;">Check that the phases/ folder deployed alongside index.html, then reload.</span>' +
    '</div>';
  console.error(err);
}

async function forceRefresh() {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) { /* ignore, reload anyway */ }
  location.reload();
}

(async function init() {
  renderLoading();
  try {
    await Promise.all([loadPhases(), loadLibrary("circuits", CIRCUITS), loadLibrary("warmups", WARMUPS)]);
    if (PHASE_ORDER.length === 0) throw new Error("No phases loaded");
    if (!PHASES[state.phase]) state.phase = PHASE_ORDER[0];
    loadStateForDay();
    render();
  } catch (e) {
    renderLoadError(e);
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
