/* ---------- minimal inline icon set (no external icon library needed) ---------- */
function Icon({ name, size = 18, color = "currentColor", strokeWidth = 2 }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "check": return <svg {...common}><polyline points="20 6 9 17 4 12" /></svg>;
    case "timer": return <svg {...common}><circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2" /><path d="M9 2h6" /></svg>;
    case "play": return <svg {...common} fill={color} stroke="none"><polygon points="6 3 20 12 6 21 6 3" /></svg>;
    case "pause": return <svg {...common} fill={color} stroke="none"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
    case "rotate-ccw": return <svg {...common}><path d="M1 4v6h6" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg>;
    case "chevron-left": return <svg {...common}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevron-right": return <svg {...common}><polyline points="9 18 15 12 9 6" /></svg>;
    case "zap": return <svg {...common} fill={color} stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>;
    case "refresh-cw": return <svg {...common}><path d="M23 4v6h-6" /><path d="M1 20v-6h6" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10" /><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14" /></svg>;
    case "mountain": return <svg {...common}><path d="M3 20l7-11 4 6 3-4 4 9H3z" /></svg>;
    case "move": return <svg {...common}><path d="M4 12h16" /><path d="M4 12l4-4M4 12l4 4" /><path d="M20 12l-4-4M20 12l-4 4" /><path d="M12 4v16" /></svg>;
    case "leaf": return <svg {...common}><path d="M11 20A7 7 0 0 1 4 13c0-5 8-11 15-11 0 8-4 18-8 18z" /><path d="M4 13c4 0 8-2 11-9" /></svg>;
    case "droplet": return <svg {...common}><path d="M12 2s6 7.5 6 12a6 6 0 0 1-12 0c0-4.5 6-12 6-12z" /></svg>;
    case "party": return <svg {...common}><path d="M5 3l3 3M9 2l1 4M2 9l4 1" /><path d="M4 20l10-4L6 6z" /><circle cx="18" cy="6" r="1" fill={color} /><circle cx="20" cy="12" r="1" fill={color} /></svg>;
    default: return null;
  }
}

}

/* ---------------------------------------------------------------
   TIMER
----------------------------------------------------------------*/
function beep(freq = 880, dur = 0.12) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.02);
  } catch (e) { /* ignore */ }
}

function IntervalTimer({ presetLabel, work, rest, rounds, accent, onClose }) {
  const [round, setRound] = useState(1);
  const [phase, setPhase] = useState("work");
  const [secondsLeft, setSecondsLeft] = useState(work);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => {
        if (s <= 1) {
          if (phase === "work") {
            beep(660);
            if (rest > 0) { setPhase("rest"); return rest; }
            if (round >= rounds) { setPhase("done"); setRunning(false); beep(440,0.3); return 0; }
            setRound((r) => r + 1); return work;
          } else if (phase === "rest") {
            if (round >= rounds) { setPhase("done"); setRunning(false); beep(440,0.3); return 0; }
            beep(990);
            setRound((r) => r + 1);
            setPhase("work");
            return work;
          }
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running, phase, round, work, rest, rounds]);

  const reset = () => { setRunning(false); setRound(1); setPhase("work"); setSecondsLeft(work); };
  const pct = phase === "work" ? (secondsLeft / work) : phase === "rest" ? (secondsLeft / rest) : 0;
  const phaseColor = phase === "work" ? accent : phase === "rest" ? "#2F6F5E" : "#8A8478";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" style={{position:"fixed",top:0,left:0,right:0,bottom:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)",padding:16}}>
      <div style={{width:"100%",maxWidth:384,borderRadius:16,background:"#F5F1E8",padding:24,boxShadow:"0 25px 50px rgba(0,0,0,0.4)",border:"2px solid #14110F"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <p style={{fontFamily:"'Oswald'",textTransform:"uppercase",letterSpacing:1,fontSize:14,color:"#8A8478",margin:0}}>{presetLabel}</p>
          <button onClick={onClose} style={{background:"none",border:"none",color:"rgba(20,17,15,0.6)",fontSize:14,cursor:"pointer"}}>Close</button>
        </div>

        <div style={{position:"relative",margin:"0 auto 20px",height:192,width:192}}>
          <svg viewBox="0 0 100 100" style={{height:"100%",width:"100%",transform:"rotate(-90deg)"}}>
            <circle cx="50" cy="50" r="46" fill="none" stroke="#E4DFD2" strokeWidth="6" />
            <circle
              cx="50" cy="50" r="46" fill="none" stroke={phaseColor} strokeWidth="6"
              strokeDasharray={2 * Math.PI * 46}
              strokeDashoffset={2 * Math.PI * 46 * (1 - (phase === "done" ? 1 : pct))}
              strokeLinecap="round"
              style={{ transition: "stroke-dashoffset 1s linear" }}
            />
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span className="tabular-nums" style={{fontFamily:"'Oswald'",fontSize:48,fontWeight:600,color:"#14110F"}}>
              {phase === "done" ? "GO" : secondsLeft}
            </span>
            <span style={{marginTop:4,fontSize:12,textTransform:"uppercase",letterSpacing:2,color:phaseColor}}>
              {phase === "done" ? "Complete" : phase}
            </span>
          </div>
        </div>

        <p style={{textAlign:"center",fontSize:14,color:"rgba(20,17,15,0.7)",marginBottom:16}}>Round {Math.min(round, rounds)} / {rounds}</p>

        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12}}>
          <button onClick={reset} style={{borderRadius:"999px",border:"2px solid #14110F",padding:12,background:"none",cursor:"pointer"}}>
            <Icon name="rotate-ccw" size={18} color="#14110F" />
          </button>
          <button
            onClick={() => setRunning((r) => !r)}
            disabled={phase === "done"}
            style={{backgroundColor:accent,borderRadius:"999px",padding:16,color:"#fff",border:"none",boxShadow:"0 10px 20px rgba(0,0,0,0.2)",cursor:"pointer",opacity:phase==="done"?0.4:1}}
          >
            <Icon name={running ? "pause" : "play"} size={22} color="#fff" />
          </button>
          <div style={{width:52}} />
        </div>
      </div>
    </div>
  );
}

----------------------------------------------------------------*/
function Checklist({ items, checkedMap, onToggle, accent }) {
  return (
    <ul style={{listStyle:"none",margin:0,padding:0,display:"flex",flexDirection:"column",gap:4}}>
      {items.map((item, i) => {
        const isArrow = item.startsWith("→");
        const done = !!checkedMap[i];
        if (isArrow) {
          return (
            <li key={i} style={{paddingLeft:4,paddingTop:6,paddingBottom:6,fontSize:11,textTransform:"uppercase",letterSpacing:0.5,color:"#8A6A52",fontWeight:600}}>
              {item}
            </li>
          );
        }
        return (
          <li key={i}>
            <button
              onClick={() => onToggle(i)}
              style={{display:"flex",width:"100%",alignItems:"flex-start",gap:10,borderRadius:8,padding:"6px 8px",textAlign:"left",background:"none",border:"none",cursor:"pointer"}}
            >
              <span style={{marginTop:2,display:"flex",height:18,width:18,flex:"none",alignItems:"center",justifyContent:"center",borderRadius:"999px",border:`2px solid ${done ? accent : "rgba(20,17,15,0.25)"}`,backgroundColor: done ? accent : "transparent"}}>
                {done && <Icon name="check" size={11} color="#fff" strokeWidth={3.5} />}
              </span>
              <span style={{fontSize:14,lineHeight:1.4,paddingTop:1,color: done ? "rgba(20,17,15,0.35)" : "#14110F", textDecoration: done ? "line-through" : "none"}}>
                {item}
              </span>
            </button>
          </li>
        );
      })}
    </ul>
  );
}

  const [checked, setChecked] = useState({});
  const [timerPreset, setTimerPreset] = useState(null);

  const dayObj = DAYS.find((d) => d.key === activeTab)?.data;
  const isRecovery = activeTab === "recovery";
  const accent = ACCENT[activeTab];
  const storageKey = `progress:w${week}:${activeTab}`;

  useEffect(() => {
    const val = loadProgress(storageKey);
    if (val) {
      setChecked(val.checked || {});
      if (val.warmupChoice) setWarmupChoice(val.warmupChoice);
    } else {
      setChecked({});
    }
  }, [storageKey]);

  const persist = useCallback((nextChecked, nextWarmup) => {
    saveProgress(storageKey, { checked: nextChecked, warmupChoice: nextWarmup ?? warmupChoice });
  }, [storageKey, warmupChoice]);

  const toggleItem = (groupIdx, itemIdx) => {
    setChecked((prev) => {
      const key = `${groupIdx}-${itemIdx}`;
      const next = { ...prev, [key]: !prev[key] };
      persist(next);
      return next;
    });
  };

  const groups = isRecovery ? [] : circuitsForDay(activeTab, week);
  const totalBoxes = isRecovery ? 0 : groups.reduce((sum, g) => sum + g.items.filter((it) => !it.startsWith("→")).length, 0);
  const doneBoxes = Object.values(checked).filter(Boolean).length;
  const dayComplete = totalBoxes > 0 && doneBoxes >= totalBoxes;

  return (
    <div style={{minHeight:"100vh",background:"#F5F1E8",color:"#14110F"}}>
      {/* HEADER */}
      <header style={{background:"#14110F",padding:"24px 20px 16px",color:"#F5F1E8"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <p style={{fontSize:10,textTransform:"uppercase",letterSpacing:3,fontWeight:600,color:accent,margin:0}}>Northeastern Track &amp; Field</p>
            <h1 style={{fontFamily:"'Oswald'",fontSize:24,fontWeight:600,textTransform:"uppercase",letterSpacing:1,lineHeight:1.2,margin:"2px 0 0"}}>Summer Training</h1>
            <p style={{fontSize:12,color:"rgba(245,241,232,0.45)",margin:"2px 0 0"}}>Triple Jump build</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",borderRadius:8,border:"1px solid rgba(245,241,232,0.2)",padding:"6px 12px",minWidth:52}}>
            <span style={{fontSize:9,textTransform:"uppercase",letterSpacing:2,color:"rgba(245,241,232,0.45)"}}>Wk</span>
            <span className="tabular-nums" style={{fontFamily:"'Oswald'",fontSize:20,fontWeight:600}}>{week}</span>
          </div>
        </div>

        <div style={{marginTop:20}}>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <button onClick={() => setWeek((w) => Math.max(1, w - 1))} style={{padding:4,background:"none",border:"none",color:"rgba(245,241,232,0.5)",cursor:"pointer"}} aria-label="Previous week">
              <Icon name="chevron-left" size={18} color="rgba(245,241,232,0.5)" />
            </button>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:3}}>
                {WEEKS.map((w) => (
                  <button
                    key={w}
                    onClick={() => setWeek(w)}
                    style={{position:"relative",flex:1,height:28,borderRadius:3,overflow:"hidden",border:"none",cursor:"pointer",
                      backgroundColor: w === week ? accent : w < week ? "#3A362F" : "#F5F1E8",
                      opacity: w === week ? 1 : w < week ? 1 : 0.14}}
                    aria-label={`Week ${w}`}
                  >
                    {w === week && (
                      <span style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#fff",fontFamily:"'Oswald'"}}>
                        {w}
                      </span>
                    )}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",gap:3,marginTop:3}}>
                {WEEKS.map((w) => (
                  <div key={w} style={{flex:1,display:"flex",justifyContent:"center"}}>
                    <div style={{width:1,background:"rgba(245,241,232,0.25)",height: w % 5 === 0 ? 6 : 3}} />
                  </div>
                ))}
              </div>
            </div>
            <button onClick={() => setWeek((w) => Math.min(11, w + 1))} style={{padding:4,background:"none",border:"none",cursor:"pointer"}} aria-label="Next week">
              <Icon name="chevron-right" size={18} color="rgba(245,241,232,0.5)" />
            </button>
          </div>
        </div>
      </header>

      {/* MAIN */}
      <main style={{padding:"20px 20px 112px",display:"flex",flexDirection:"column",gap:16}}>
        {!isRecovery && (
          <React.Fragment>
            <div style={{borderRadius:12,background:"#fff",overflow:"hidden",border:"1px solid rgba(20,17,15,0.1)"}}>
              <div style={{height:4,backgroundColor:accent}} />
              <div style={{padding:16}}>
                <h2 style={{fontFamily:"'Oswald'",fontSize:18,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,margin:0}}>{dayObj.full}</h2>
                <p style={{marginTop:4,fontSize:14,color:"rgba(20,17,15,0.65)"}}>{dayObj.base}</p>
                <div style={{marginTop:12,borderRadius:8,padding:"10px 12px",backgroundColor:`${accent}12`,border:`1px solid ${accent}35`}}>
                  <p style={{fontSize:14,fontWeight:600,margin:0}}>Week {week}: {dayObj.weeks[week]}</p>
                </div>
                {activeTab === "day4" && (
                  <a href={DAY4.lungeMatrixUrl} target="_blank" rel="noreferrer" style={{marginTop:8,display:"inline-block",fontSize:12,color:accent}}>
                    Lunge Matrix video ↗
                  </a>
                )}
              </div>
            </div>

            <div style={{borderRadius:12,padding:16,border:"1px solid rgba(47,111,94,0.3)",backgroundColor:"rgba(47,111,94,0.06)"}}>
              <p style={{fontSize:10,textTransform:"uppercase",letterSpacing:2,fontWeight:700,color:"#2F6F5E",margin:0}}>Triple Jump Note</p>
              <p style={{marginTop:4,fontSize:14,color:"rgba(20,17,15,0.8)",lineHeight:1.4}}>{dayObj.tj}</p>
            </div>

            {(activeTab === "day1" || activeTab === "day3") && (
              <div style={{borderRadius:12,background:"#fff",border:"1px solid rgba(20,17,15,0.1)",padding:16}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <h3 style={{fontFamily:"'Oswald'",fontSize:14,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,margin:0}}>Warm Up</h3>
                  <select
                    value={warmupChoice}
                    onChange={(e) => { setWarmupChoice(e.target.value); persist(checked, e.target.value); }}
                    style={{borderRadius:6,border:"1px solid rgba(20,17,15,0.2)",background:"#F5F1E8",padding:"4px 8px",fontSize:12}}
                  >
                    {Object.entries(WARMUPS).map(([k, v]) => <option key={k} value={k}>{v.name}</option>)}
                  </select>
                </div>
                <div style={{marginTop:8}}>
                  <Checklist
                    items={WARMUPS[warmupChoice].items}
                    checkedMap={Object.fromEntries(Object.entries(checked).filter(([k]) => k.startsWith("warmup-")).map(([k, v]) => [k.replace("warmup-", ""), v]))}
                    onToggle={(i) => {
                      setChecked((prev) => {
                        const key = `warmup-${i}`;
                        const next = { ...prev, [key]: !prev[key] };
                        persist(next);
                        return next;
                      });
                    }}
                    accent={accent}
                  />
                </div>
              </div>
            )}

            {totalBoxes > 0 && !dayComplete && (
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{height:6,flex:1,borderRadius:999,background:"rgba(20,17,15,0.1)",overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:999,backgroundColor:accent,width:`${Math.min(100, (doneBoxes / totalBoxes) * 100)}%`,transition:"width 0.2s"}} />
                </div>
                <span className="tabular-nums" style={{fontSize:12,color:"rgba(20,17,15,0.45)"}}>{doneBoxes}/{totalBoxes}</span>
              </div>
            )}

            {dayComplete && (
              <div style={{display:"flex",alignItems:"center",gap:10,borderRadius:12,padding:"12px 16px",backgroundColor:accent}}>
                <Icon name="party" size={18} color="#fff" />
                <p style={{fontSize:14,fontWeight:600,color:"#fff",margin:0}}>Session logged. Nice work.</p>
              </div>
            )}

            {groups.map((g, gi) => (
              <div key={gi} style={{borderRadius:12,background:"#fff",border:"1px solid rgba(20,17,15,0.1)",padding:16}}>
                <h3 style={{fontFamily:"'Oswald'",fontSize:14,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 6px"}}>{g.name}</h3>
                <Checklist
                  items={g.items}
                  checkedMap={Object.fromEntries(Object.entries(checked).filter(([k]) => k.startsWith(`${gi}-`)).map(([k, v]) => [k.replace(`${gi}-`, ""), v]))}
                  onToggle={(i) => toggleItem(gi, i)}
                  accent={accent}
                />
              </div>
            ))}

            {activeTab === "day2" && week <= 8 && (
              <div style={{borderRadius:12,background:"#fff",border:"1px solid rgba(20,17,15,0.1)",padding:16}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <Icon name="timer" size={16} color={accent} />
                  <h3 style={{fontFamily:"'Oswald'",fontSize:14,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,margin:0}}>Plyo Timer</h3>
                </div>
                <p style={{fontSize:12,color:"rgba(20,17,15,0.55)",marginBottom:12}}>
                  {week <= 4 ? "This week uses 20\"/40\" intervals." : "This week uses 30\"/30\" intervals."}
                </p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  {TIMER_PRESETS.filter((p) => (week <= 4 ? p.label.includes("20") : p.label.includes("30") && p.label.includes("Plyo"))).map((p) => (
                    <button
                      key={p.label}
                      onClick={() => setTimerPreset(p)}
                      style={{borderRadius:8,border:`2px solid ${accent}`,padding:"8px 12px",fontSize:12,fontWeight:600,color:accent,background:"none",cursor:"pointer"}}
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
            {(groups.some((g) => g.name.includes("Vacation")) || groups.some((g) => g.name.includes("Dudley"))) && (
              <div style={{borderRadius:12,background:"#fff",border:"1px solid rgba(20,17,15,0.1)",padding:16}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <Icon name="timer" size={16} color={accent} />
                  <h3 style={{fontFamily:"'Oswald'",fontSize:14,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,margin:0}}>Circuit Timer</h3>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  {TIMER_PRESETS.filter((p) => p.label.includes("Vacation") || p.label.includes("Dudley")).map((p) => (
                    <button
                      key={p.label}
                      onClick={() => setTimerPreset(p)}
                      style={{borderRadius:8,border:`2px solid ${accent}`,padding:"8px 12px",fontSize:12,fontWeight:600,color:accent,background:"none",cursor:"pointer"}}
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </React.Fragment>
        )}

        {isRecovery && (
          <React.Fragment>
            <div style={{borderRadius:12,background:"#fff",overflow:"hidden",border:"1px solid rgba(20,17,15,0.1)"}}>
              <div style={{height:4,backgroundColor:accent}} />
              <div style={{padding:16}}>
                <h2 style={{fontFamily:"'Oswald'",fontSize:18,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,margin:0}}>{RECOVERY.full}</h2>
                <p style={{marginTop:4,fontSize:14,color:"rgba(20,17,15,0.65)"}}>{RECOVERY.text}</p>
              </div>
            </div>
            <div style={{borderRadius:12,padding:16,display:"flex",gap:10,border:"1px solid rgba(47,111,94,0.3)",backgroundColor:"rgba(47,111,94,0.06)"}}>
              <Icon name="droplet" size={18} color="#2F6F5E" />
              <p style={{fontSize:14,color:"rgba(20,17,15,0.8)",lineHeight:1.4,margin:0}}>{RECOVERY.tj}</p>
            </div>
            <div style={{borderRadius:12,background:"#fff",border:"1px solid rgba(20,17,15,0.1)",padding:16}}>
              <h3 style={{fontFamily:"'Oswald'",fontSize:14,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 8px"}}>Pick something</h3>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {RECOVERY.options.map((o) => (
                  <span key={o} style={{borderRadius:999,padding:"4px 12px",fontSize:12,backgroundColor:`${accent}12`,color:"rgba(20,17,15,0.7)"}}>{o}</span>
                ))}
              </div>
            </div>
          </React.Fragment>
        )}
      </main>

      {/* BOTTOM TAB BAR */}
      <nav style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(255,255,255,0.95)",backdropFilter:"blur(8px)",borderTop:"1px solid rgba(20,17,15,0.1)",display:"flex",paddingBottom:"env(safe-area-inset-bottom, 0px)"}}>
        {TABS.map((t) => {
          const isActive = activeTab === t.key;
          const tabAccent = ACCENT[t.key];
          return (
            <button
              key={t.key}
              onClick={() => setActiveTab(t.key)}
              style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"10px 0",background:"none",border:"none",cursor:"pointer"}}
            >
              <Icon name={TAB_ICON[t.key]} size={19} color={isActive ? tabAccent : "rgba(20,17,15,0.35)"} strokeWidth={isActive ? 2.4 : 1.8} />
              <span style={{fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,color: isActive ? tabAccent : "rgba(20,17,15,0.35)"}}>
                {t.data.label}
              </span>
              {isActive && <span style={{height:3,width:16,borderRadius:999,marginTop:2,backgroundColor:tabAccent}} />}
            </button>
          );
        })}
      </nav>

      {timerPreset && (
        <IntervalTimer
          presetLabel={timerPreset.label}
          work={timerPreset.work}
          rest={timerPreset.rest}
          rounds={timerPreset.rounds}
          accent={accent}
          onClose={() => setTimerPreset(null)}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
